# agint-restart loader entry 模板
#
# 用途：把本插件挂到顶层 profile-patches/web/cordis.patch.yml 的 loader list 中。
# 使用方式（手工）：
#   1. 把下面 - insert 子片段整段 copy 到顶层 cordis.patch.yml 中
#      （与 agint-quality-sandbox 同一 tier 块；mountOrder 50 排在 mount 后面）
#   2. 跑 bin/safe-update.sh smoke 验一遍
#   3. bin/safe-update.sh mount-patch 拍快照
#   4. bin/restart-runbook.ps1 重启
#
# 本文件**不**由 loader 自动包含；首次挂载由老板走 safe-update 合并（AGENTS.md 红线）。
#
# v0.2.0 新增配置项（主动重启）：mode / cooldownMs / burstWindowMs / burstMax /
#   waitExitMs / forceKillAfterMs / portFreeTimeoutMs / readiness / logFile /
#   exitStrategy / shutdownDelayMs / launch
# v0.3.1 修正配置项：deliveryMode（wake | silent，取代语义反直觉的 wakeup 布尔）
# v0.4.0 新增配置项：notifyDebounceMs（相邻启动间隔抖动窗口）
# v0.5.0 新增配置项：openBrowserOnRestart / resumeOnSelfRestart（防弹窗 + 断环）
# v0.6.0：win32 改 WScript 隐藏启动（修"每调一次工具弹一次黑框"），新增启动方式探测与回退
# v0.6.1 修正（恢复投递 = 会话接续）：resumeOnSelfRestart 默认 false→true、
#   notifyDebounceMs 300000→60000。旧默认把"凡走插件协议的重启"都当成"不需要恢复"，
#   恢复通知几乎永远发不出去；断环改由通知文案 + restart_request 的 burst 熔断承担。
#
# ⚠️ YAML 陷阱（2026-09-10 踩过）：同一个 config 映射里 shutdownDelayMs 曾出现两次，
#    解析器直接抛 `duplicated mapping key`。改这个文件后务必：
#      NODE_PATH=D:/DSH/node_modules node -e "require('js-yaml').load(require('fs').readFileSync('cordis.patch.yml','utf8'))"
#
# 工具需要额外在 preset 里加一行（首挂走 safe-update，红线）：
#   - id: agint-restart-tools
#     name: ../../profiles/web/plugins/agint-restart/lib/tools.js

# agint-restart: v0.2.0 DSH 重启闭环插件（检测 + 主动重启）。
#   v0.1.0（借鉴 nickkkkkk123123/dsh-resume-on-restart，scope 1:1）：
#   - marker 文件记录 pid / lastBootAt / lastSessionId
#   - 启动时对比当前 pid，判定为重启则向主 agent 投递"中断时长 + 上次活跃会话"摘要
#   - agent 自主决定继续 / 换任务 / 忽略（不强制）
#   - 优雅关闭走 cordis dispose 钩子（修正上游 SIGTERM 二次 kill bug）
#   - 活动追踪监听 agent/session-start + agent/pre-step
#   v0.2.0 新增（主动重启）：
#   - 写 request.json → detached 拉起 lib/respawn.js → 自己延迟退出
#   - respawn 等旧进程退出 + 3080 端口释放 → 拉起新 dsh → 等 lease/端口就绪
#   - 护栏：confirm 必填 / cooldown / 窗口内次数熔断 / 单在途请求 / dryRun
#   - 只依赖 cordis ctx 的 agents 服务（不 import 任何 dsh-* 内部包）
#   v0.3.0 修正（投递语义）：
#   - 投递目标优先匹配 lastSessionId 回旧会话（旧版取 roots[0]，消息落不到被中断的会话）
#   - 新增 deliveryMode: queue | inject，取代语义反直觉的 wakeup 布尔
#     （旧 wakeup 仍兼容：true→queue，false→inject）
#   v0.4.4 修正（输出契约）：
#   - schema 与返回值收敛到 lib/contract.js（字段表 → schema + 分支构造函数 + 兜底 normalize）
#   - request() 绝不抛异常；返回值新增 sideEffect（本次调用是否真的推进了重启链路）
#   - 修掉「工具报 invalid output 但重启已经发生」的误导性报错（accepted 分支漏 code）
#   v0.5.0 修正（防弹窗 + 断环）：
#   - 拉起参数归一化：给 `dsh web` 补 --no-open（原来每次重启都自动弹一次浏览器）
#   - 自触发重启不再投递恢复通知（resumeOnSelfRestart=false）：
#     切断 通知→唤醒 agent→干活→自己重启→又通知 的自维持环
#   - status() / detect() 暴露 selfRestart / selfRestartRequestId，便于排查
#   v0.6.0 修正（控制台隔离）：
#   - win32 改走 WScript 隐藏启动：detached 拉起的 dsh 没有控制台，导致它 spawn 的
#     每个子进程都新建控制台窗口（"每调一次工具弹一次黑框"）。改为 SW_HIDE 启动 +
#     .cmd 承接输出重定向：窗口不可见但控制台真实存在，子进程共享它
#   - 启动前先探测该链路可用，不可用自动回退 detached（会弹窗但 dsh 一定起得来）
#   - newPid 反查真实 dsh pid（netstat），壳 pid 记在 launchShellPid
#   v0.6.1 修正（恢复投递）：
#   - resumeOnSelfRestart 默认 true：旧默认下"凡走插件协议的重启"都不投恢复通知，
#     老板让 agent 重启并要求"重启完向我问好"永远收不到 → 会话不接续
#   - notifyDebounceMs 300000 → 60000：原 5 分钟窗口吞掉正常重启的投递
#   - 断环改由通知文案（"不需要再次重启"）+ restart_request burst 熔断承担
#   v0.7.1 断环修正（文案退化为纯状态，老板 2026-09-11 拍板「注入"已重启"就行了」）：
#   - 通知文案只报「[agint-restart] DSH 已重启。」：任何"请自主决定下一步 / 如需继续之前的工作"
#     式措辞都会把一条状态消息变成工作指令——唤醒后的会话会把上下文里未完成的老板旧指令
#     当新指令再执行一遍（2026-09-10 实测两次重启 reason 逐字相同）→ 自维持重启环
#   - 细节（中断时长 / 上次活跃会话 / 是否自触发）不再进消息体，看 restart_status + wake.log
- insert:
    - id: agint-restart
      name: ./plugins/agint-restart/lib/index.js
      config:
        enabled: true
        stateDir: .agint-restart
        target: primary
        # wake   = followup = send(next-turn, wakeup=true)  → 唤醒 agent，真正开始干活
        # silent = inject   = send(next-step, wakeup=false) → 只入收件箱，不唤醒（看不到回音）
        # ⚠️ 别凭方法名猜：inject 是"静默塞入"，不是"立即触发"（v0.3.1 实测纠正）
        # 线上选 wake：重启后 agent 自动续跑被中断的工作（插件本意）。
        # 注意后果：旧会话里若中断的是长任务/危险操作，agent 会自行继续。
        # 想先"汇报等我确认"的话，用 notice 加约束语，例如：
        #   notice: '先汇报中断前在做什么，等我确认后再继续，不要自行执行。'
        deliveryMode: wake
        # 优先把通知投回"重启前最近活跃的会话"（只有它带上下文）；匹配不到再回退 target
        resumeLastSession: true
        resumeWaitMs: 5000
        # 相邻两次启动间隔 < 这个窗口视为抖动，不投递（防连续 restart 反复弹通知）。
        # v0.6.1：300000 → 60000。5 分钟会把"重启后 1-3 分钟又重启"的正常场景吞掉
        # （实测 downtime=100131ms 被误挡 → 恢复通知发不出去 → 会话不接续）。
        # 它只挡"刚起来又被拉起"的抖动；重启环由 burst 熔断（600s 内 3 次）兜底。
        # 仅作用于"是否投递"分支；marker / status / 主动重启链路不受影响。<=0 表示关闭
        notifyDebounceMs: 60000
        # ── v0.5.0 防弹窗 / 断环 ──
        # 拉起新实例时是否允许它自动打开浏览器。默认 false → 给 launch 参数补 --no-open。
        # 原因：dsh web 的 openBrowser 默认 true，插件每次拉起都会弹一次浏览器
        #      （2026-09-10 实测 16 次重启 = 16 次 "opening the default browser"）。
        openBrowserOnRestart: false
        # 自触发重启（经插件协议发起，含 agent 自己调 restart_request）是否也投递"恢复"通知。
        # v0.6.1：false → true。detectSelfRestart 判的是"这次启动留没留请求文件"——
        # 凡走插件协议的重启都算自触发，旧默认等于"恢复通知几乎永远发不出去"
        # （老板让 agent 重启并要求"重启完向我问好"，消息被吞，会话不接续）。
        # 现在照常投递；断环改由 v0.7.1 的纯状态文案承担（消息体只报「DSH 已重启。」，不含行动指令）。
        # 置 false 可退回旧行为（自触发不投恢复通知）。
        resumeOnSelfRestart: true
        # 发出重启请求后延迟多久退出自己；这段完全计入用户感知的"重启等待"
        shutdownDelayMs: 1500
        notice: ''
        shutdownGraceMs: 600000
        ignoredSessionPrefixes:
          - head-
        # ── 主动重启 ──
        mode: auto
        cooldownMs: 60000
        burstWindowMs: 600000
        burstMax: 3
        waitExitMs: 30000
        forceKillAfterMs: 20000
        portFreeTimeoutMs: 15000
        readiness:
          leasePath: sentinel.lease
          port: 3080
          timeoutMs: 60000
        logFile: C:\Users\Administrator\AppData\Local\Temp\dsh-web.log
        exitStrategy: exit
