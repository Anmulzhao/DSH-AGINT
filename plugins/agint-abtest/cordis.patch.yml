# agint-abtest loader entry 模板
#
# 用途：把本插件挂到顶层 profile-patches/web/cordis.patch.yml 的 loader list 中。
# 使用方式（手工）：
#   1. 把下面这段 - insert 子片段整段 copy 到顶层 cordis.patch.yml 中
#      （与 agint-quality-static 同一 tier 块的末尾，mountOrder 37 接在 36 后面）
#   2. 跑 bin/safe-update.sh smoke 验一遍
#   3. bin/safe-update.sh mount-patch 拍快照
#   4. bin/safe-update.sh restart 重启
#
# 本文件**不**由 loader 自动包含；Sprint 10 子任务 #9 + #11 收口后由老板走 safe-update 重启时合并。
# 子任务官方流程不允许本 sprint 顺手改顶层 cordis.patch.yml（设计稿 §五 / AGENTS.md 红线）。

# agint-abtest: v0.6.4 Prompt-A/B 测试基础设施独立插件（host service）。
#   - 3 个 Service：start / report / listTests
#   - 4 个统计纯函数：welchTTest / bonferroniAdjust / cohensD / decideWinner
#   - 独立存储域：agint_abtest（2 表 abtests 50 + samples 10000）
#   - 统计护栏：任务集 ≥10 + Bonferroni 校正 + Cohen's d ≥0.3
#   - 不引用 quality-contract FROZEN 接口（设计稿 §七 L0 治理）
#   - 不引入第三方统计库（纯 JS 自写 normal CDF 近似）
- insert:
    - id: agint-abtest
      name: ./plugins/agint-abtest/lib/index.js
      config: {}