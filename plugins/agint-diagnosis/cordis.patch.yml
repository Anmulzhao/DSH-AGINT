# agint-diagnosis loader entry 模板
#
# 用途：把本插件挂到顶层 profile-patches/web/cordis.patch.yml 的 loader list 中。
# 使用方式（手工）：
#   1. 把下面这段 - insert 子片段整段 copy 到顶层 cordis.patch.yml 中
#      （与 agint-evolution-memory 同一 tier 块的末尾）
#   2. 跑 bin/safe-update.sh smoke 验一遍
#   3. bin/safe-update.sh mount-patch 拍快照
#   4. bin/safe-update.sh restart 重启
#
# 本文件**不**由 loader 自动包含；子任务 #2 完成后由老板走 safe-update 重启时合并。
# 子任务官方流程不允许本 sprint 顺手改顶层 cordis.patch.yml（设计稿 §五 / AGENTS.md 红线）。

# agint-diagnosis: v0.6.0 归因引擎（host service）。
#   - 4 个 Service：annotate / counterfactual / cluster / report（本次仅骨架）
#   - 独占 agint_diagnosis 存储域（3 表 annotations/clusters/reports）
#   - 依赖 agint-evolution-memory.failure_pattern（只读，agint.evolution 可选 inject）
#   - 不调用 agint-quality-contract FROZEN 接口（设计稿 §七 L0 治理）
- insert:
    - id: agint-diagnosis
      name: ./plugins/agint-diagnosis/lib/index.js
      config: {}
