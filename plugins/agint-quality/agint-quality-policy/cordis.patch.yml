# agint-quality-policy loader entry 模板
#
# 用途：把本插件挂到顶层 profile-patches/web/cordis.patch.yml 的 loader list 中。
# 使用方式（手工）：
#   1. 把下面这段 - insert 子片段整段 copy 到顶层 cordis.patch.yml 中
#   2. 跑 bin/safe-update.sh smoke 验一遍
#   3. bin/safe-update.sh mount-patch 拍快照
#   4. bin/safe-update.sh restart 重启
#
# 本文件**不**由 loader 自动包含；本插件已是基座，历史上线；不在 Sprint 10 v0.6.3 / v0.6.4 主动改动挂载策略。

# agint-quality-policy: v0.6.4 D-QAF Phase 4 策略引擎（基座）。
#   - decide(results, config, options) → Decision（4 决策：AUTO_DEPLOY / PENDING_REVIEW / REJECT / ABSTAIN）
#   - Sprint 10 v0.6.4 #10 加权综合分支持 abtest 维度（config.abtest.enabled=true）
#   - 不引用 quality-contract FROZEN 接口（设计稿 §七 L0 治理）
- insert:
    - id: agint-quality-policy
      name: ./plugins/agint-quality/agint-quality-policy/lib/index.js
      config: {}