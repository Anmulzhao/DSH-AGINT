# agint-input-gateway loader entry 模板
#
# 用途：把本插件挂到顶层 profile-patches/web/cordis.patch.yml 的 loader list 中。
# 使用方式（手工，走 safe-update SOP）：
#   1. 把下面 - insert 子片段整段 copy 到顶层 cordis.patch.yml
#      （建议放 agint-compress-guard 之后；mountOrder 35）
#   2. bin/safe-update.sh smoke 验一遍
#   3. bin/safe-update.sh mount-patch 拍快照
#   4. 老板手动重启 dsh
#
# preset 侧工具（6 个）——在 presets/agint/agent.cordis.yml 加一行：
#   - id: agint-input-gateway-tools
#     name: ../../profiles/web/plugins/agint-input-gateway/lib/tools.js

- insert:
    - id: agint-input-gateway
      name: ./plugins/agint-input-gateway/lib/index.js
      config: {}
