# agint-skill-autocreate loader entry 模板
#
# 用途：把本插件挂到顶层 profile-patches/web/cordis.patch.yml 的 loader list 中。
# 使用方式（手工，走 safe-update SOP）：
#   1. 把下面这段 - insert 子片段整段 copy 到顶层 cordis.patch.yml 中
#      （建议放 agint-event-bus 之后、agint-self-model 之前）
#   2. bin/safe-update.sh smoke 验一遍
#   3. bin/safe-update.sh mount-patch 拍快照
#   4. bin/safe-update.sh restart 重启
#
# 本文件**不**由 loader 自动包含；按子任务官方流程，本 sprint 不顺手改顶层
# cordis.patch.yml（与 agint-diagnosis 同策略），由老板走 safe-update 合并。
#
# preset 侧工具（可选，Sprint 14 为 3 个只读工具）——在
# presets/agint/agent.cordis.yml 加一行（参照 agint-evolve-tools 写法）：
#   - id: agint-skill-autocreate-tools
#     name: ../../profiles/web/plugins/agint-skill-autocreate/lib/tools.js

# agint-skill-autocreate: P0-1 技能自动创建（Sprint 14 检测层）。
#   - Service：agint.skillAutocreate（detect/listPatterns/listCandidates/
#     getCandidate/rejectCandidate/modifyCandidate/stats/pause/resume/config）
#   - triggerEval / release / rollback 显式抛未实现（Sprint 15/16 接力）
#   - 独占 agint_skill_autocreate 存储域（5 表）
#   - 软依赖 event-bus（pattern-detected / candidate-created 两事件）
#   - 每日聚合由 agint-cron 的 skill-autocreate-aggregate job 驱动（04:45）
- insert:
    - id: agint-skill-autocreate
      name: ./plugins/agint-skill-autocreate/lib/index.js
      config: {}
