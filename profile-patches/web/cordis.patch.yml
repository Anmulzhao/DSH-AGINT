# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# This file mounts the AGINT (智进) host services into the dsh web profile.
# The plugins themselves live at D:\DSH\project\DSH-AGINT\plugins\agint-*
# and are installed via the install script. If the plugin source is not yet
# available, comment out the corresponding rows below.

# ── AGINT 智进 host services ──────────────────────────────────────────────────
#
# Host-plane row that injects a service is the criterion for host-plane
# ownership: injection resolves before any session exists, so there is no
# agent to key by. Every agint-* plugin below is a host service consumer,
# not a per-session capability — they all sit in this patch layer.

- insert:
    # agint-memory: long-term memory (L1-L4 four-tier forgetting). Owns the
    # `agint` storage domain exclusively.
    - id: agint-memory
      name: ./plugins/agint-memory/lib/index.js
      config: {}

    # agint-dream: nightly dream service (light → REM → deep). Reads session
    # logs → heuristics → six-dim score → gate → promote into agint.memory.
    # Diary at <root>/YYYY-MM-DD.md. Triggered by agint-cron's night-dream
    # job (daily 03:00).
    - id: agint-dream
      name: ./plugins/agint-dream/lib/index.js
      config:
        root: !!js (process.env.AGINT_HOME || (process.env.HOME + '/projects/AGINT')) + '/dreams'
        sessionsRoot: !!js (process.env.DSH_HOME || (process.env.HOME + '/.dsh')) + '/sessions'
        lookbackDays: 2

    # agint-wiki: knowledge base (independent of task memory).
    - id: agint-wiki
      name: ./plugins/agint-wiki/lib/index.js
      config:
        root: !!js (process.env.DSH_WIKI_ROOT || 'D:/DSH/wiki')

    # agint-cron: scheduled tasks. 5-segment cron, missed triggers do NOT replay.
    - id: agint-cron
      name: ./plugins/agint-cron/lib/index.js
      config: {}

    # agint-rules: rule gate (advisory + ask + deny). Owns `agint_rules` domain
    # exclusively. Listens on tools/pre-execute + tools/post-execute waterfalls.
    - id: agint-rules
      name: ./plugins/agint-rules/lib/index.js
      config: {}

    # agint-metrics: evolution metrics. Owns `agint_metrics` domain. Reads
    # agint.cron/rules/wiki/memory lazy, writes kv time series. Daily via cron.
    - id: agint-metrics
      name: ./plugins/agint-metrics/lib/index.js
      config: {}

    # agint-evolve: review / self-evolution loop. Reports to <root>/reviews.
    # Sundays via cron's evolve-review job.
    - id: agint-evolve
      name: ./plugins/agint-evolve/lib/index.js
      config:
        root: !!js (process.env.AGINT_HOME || (process.env.HOME + '/projects/AGINT')) + '/reviews'

    # agint-tool-stats: tool usage profile. Listens on tools/result events,
    # appends to ~/.dsh/storages/agint_tool_stats.jsonl.
    - id: agint-tool-stats
      name: ./plugins/agint-tool-stats/lib/index.js
      config: {}

    # agint-quality-contract: D-QAF evaluation framework Seam layer (FROZEN).
    # Defines schemas + interfaces; siblings (eval/sandbox/policy/report) plug
    # in. L0-frozen field guard via validatePatch.
    - id: agint-quality-contract
      name: ./plugins/agint-quality/agint-quality-contract/lib/index.js
      config: {}

    # agint-quality-sandbox: D-QAF sandbox runtime v0.6.3. In-process/隔离双模式
    # 资源矩阵 + runSmoke/runVerify/runExplore；provide agint.qualitySandbox。
    # agint-quality-eval / agint-mount 依赖此服务。
    - id: agint-quality-sandbox
      name: ./plugins/agint-quality-sandbox/lib/index.js
      config: {}

    # agint-quality-eval: D-QAF evaluation engine v0.2. 7-dim scoring; safety
    # gate (×0.30) vetoes below 0.5 → REJECT. Sunday 04:30 weekly evaluation.
    # Reject self-evaluation.
    - id: agint-quality-eval
      name: ./plugins/agint-quality/agint-quality-eval/lib/index.js
      config: {}

    # agint-quality-policy: D-QAF Phase 4 policy engine. 4 decisions
    # (AUTO_DEPLOY / PENDING_REVIEW / REJECT / ABSTAIN); false-harmony
    # detector + meta-evaluation committee.
    - id: agint-quality-policy
      name: ./plugins/agint-quality/agint-quality-policy/lib/index.js
      config: {}

    # agint-quality-report: HARM report generator. QualityReporterIface impl.
    # REMOVED: model-facing 入口 + host patch 均已撤；weekly scheduler 仍按
    # 原设计尝试调用 agint.qualityReporter，宿主缺失时软降级（不再有 report）。
    # 如需恢复：在 host composition 重新挂回本 row，并在 preset 加
    # agint-quality-report-tools 行（参考 git log）。
    # - id: agint-quality-report
    #   name: ./plugins/agint-quality/agint-quality-report/lib/index.js
    #   config: {}

    # agint-quality-sdk: Prompt SDK v0.5. PromptManifest FROZEN schema +
    # template engine + static check + CLI.
    - id: agint-quality-sdk
      name: ./plugins/agint-quality-sdk/lib/index.js
      config: {}

    # agint-quality-static: static-analysis rule check v0.8.0（2026-09-08 升级）.
    # 插件向 6 族（l0-isolation + safety-boundary + prompt-injection 等）+
    # 技能候选向 4 族 blocker（skill-format / dangerous-command / secret-scan /
    # prompt-hijack，Sprint 15 T2，默认禁用防既有插件误报，经 SKILL_FAMILY_ENABLED
    # 组合才启用；secret-scan 审计输出对密钥打码防二次泄露）。
    - id: agint-quality-static
      name: ./plugins/agint-quality-static/lib/index.js
      config: {}

    # agint-diagnosis: attribution engine v0.6.0. 6-class root-cause tagging
    # + counterfactual simulation + pattern clustering + time-window reports.
    - id: agint-diagnosis
      name: ./plugins/agint-diagnosis/lib/index.js
      config: {}

    # agint-population: population manager v0.6.2. Three-variant tournament.
    - id: agint-population
      name: ./plugins/agint-population/lib/index.js
      config: {}

    # agint-mount: dynamic mount orchestrator v0.6.5. 4-state state machine +
    # three-segment transaction + health probe + L0 isolation.
    - id: agint-mount
      name: ./plugins/agint-mount/lib/index.js
      config: {}


    # agint-restart: DSH restart detector v0.1.0 (2026-09-10).
    #   Inspired by nickkkkkk123123/dsh-resume-on-restart (scope 1:1);
    #   marker file + pid diff + cordis dispose hook (fixes upstream SIGTERM double-kill bug);
    #   agent decides next step autonomously (no forced continue);
    #   rollback: delete this block + bin/safe-update.sh rollback <TS>.
- insert:
    - id: agint-restart
      name: ./plugins/agint-restart/lib/index.js
      config:
        enabled: true
        stateDir: .agint-restart
        target: primary
        deliveryMode: wake
        resumeLastSession: true
        resumeWaitMs: 5000
        # 抖动窗口：相邻两次启动间隔小于此值则不投递通知（只挡"刚起来又被拉起"的抖动）。
        # v0.6.1：300000 → 60000。5 分钟窗口会吞掉"重启后 1-3 分钟又重启"的正常投递，
        # 导致恢复通知发不出去、会话不接续；重启环由 restart_request 的 burst 熔断兜底。
        notifyDebounceMs: 60000
        # v0.5.0：允许拉起的新实例自动打开浏览器吗？false = 给 dsh web 补 --no-open。
        # dsh web 默认 openBrowser=true，不改的话每次重启都弹一个新浏览器标签/窗口。
        openBrowserOnRestart: false
        # v0.6.1：自触发重启是否也投"恢复"通知？true = 投（保证会话接续）。
        # 旧默认 false 的判据实际是"这次启动留没留请求文件"= 凡走插件协议的重启，
        # 等于恢复通知几乎永远发不出去（老板让 agent 重启并要求"重启完向我问好"收不到）。
        # 断环改由通知文案（"不需要再次重启"）+ restart_request 的 burst 熔断承担。
        resumeOnSelfRestart: true
        # 发出重启请求后延迟多久退出（计入用户感知的等待时间）
        shutdownDelayMs: 1500
        notice: ''
        shutdownGraceMs: 600000
        ignoredSessionPrefixes:
          - head-

    # agint-abtest: A/B test framework v0.6.4.
    - id: agint-abtest
      name: ./plugins/agint-abtest/lib/index.js
      config: {}

    # agint-event-bus: event bus v0.7.0. FROZEN event-bus schema + 3 services +
    # deadletter / isolation / backoff / traceId + sync quota.
    - id: agint-event-bus
      name: ./plugins/agint-event-bus/lib/index.js
      config: {}

    # agint-skill-autocreate: P0-1 技能自动创建 v0.2.0（Sprint 14 检测层 +
    # Sprint 15 P0-1 评估层，2026-09-08 升级，storage schemaVersion 1 不变）。
    # 聚合 tool-stats JSONL → 重复任务模式检测 → SKILL.md 候选提案 → A 路径分流评估：
    # 复用 D-QAF 执行层与阶段结构，但**不复用综合分做放行**（新候选 composite 恒
    # 71.4 < 75 的语义错配）→ 硬门判定 + 得分仅排队，输出 provisional: true +
    # evidence E0，evolution 写 phase3-provisional tag（P0-2 curator 跨域读取）。
    # Service：agint.skillAutocreate（detect/listPatterns/listCandidates/getCandidate/
    # rejectCandidate/modifyCandidate/staging/evaluator/triggerEval/stats/pause/resume/config）。
    # release / rollback 显式抛未实现（Sprint 16 发布层接力，prune 默认禁用）。
    # 独占 agint_skill_autocreate 存储域（5 表）。软依赖 event-bus
    # （pattern-detected / candidate-created 两事件）+ quality-static（软）。
    # 每日聚合由 agint-cron 的 skill-autocreate-aggregate job 驱动（04:45）。
    - id: agint-skill-autocreate
      name: ./plugins/agint-skill-autocreate/lib/index.js
      config: {}

    # agint-curator: P0-2 技能策展人 v0.2.0（Sprint 14 阶段 1 基础策展 + Sprint 15 阶段 2
    # 智能策展）— 2026-09-07 挂载 v0.1.0，2026-09-08 升级 v0.2.0（schemaVersion 1→2 已迁移，
    # 增 overlap_candidates 表；skill_states/reports 旧数据向后兼容）。
    # 扫描 preset skills 目录 + tool-stats JSONL → 状态机（active/stale/archived/
    # pinned/quality_declining）→ 每周自动策展 + 报告。Service：agint.curator（run/dryRun/
    # listSkills/getSkill/pin/unpin/archive/unarchive/stats/getReport/pause/resume/config/
    # listOverlaps/listDeclining）。
    # Sprint 15 新增：三维度重叠检测（curator.overlap-detected 事件 + overlap_candidates 表 +
    # curator_list_overlaps 工具）、质量评估（成功率周快照 + 跨域 evolution 读取
    # phase3-provisional HARM 趋势 → quality_declining 状态 + curator.quality-declining 事件 +
    # curator_list_declining 工具）、质量加速规则 1-3（§7.2）。
    # consolidate / prune 显式抛未实现（Sprint 16，prune 默认永久禁用）。
    # 独占 agint_curator 存储域（5 表）。软依赖 event-bus
    # （skill-staled/archived/reactivated/pinned/run-completed/overlap-detected/
    # quality-declining/consolidate-proposed）+ agint.evolution（软，缺失降级）。
    # 每周策展由 agint-cron 的 curator-weekly job 驱动（周日 02:00）。
    # ⚠️ 保守：auto_curation_enabled: false → cron 全流程 dry-run（重叠/归档只检测不落盘），
    #    观察两周报告后改 true 放行（或随时 curator_pause/curator_resume）。
    - id: agint-curator
      name: ./plugins/agint-curator/lib/index.js
      config:
        auto_curation_enabled: false

    # agint-mutator: mutation constructor v0.6.1. 3 modification schemes
    # (PROMPT_MUTATION / TOOL_SYNTHESIS / STRATEGY_REWRITE) +
    # propose/validate/commit/rollback three-segment transaction.
    # NOTE: 必须排在 agint-event-bus 之后——mutator 启动时一次性读取
    # agint.eventBus.subscribe，取不到会永久降级（diagnosis.completed 影子观察失效）。
    - id: agint-mutator
      name: ./plugins/agint-mutator/lib/index.js
      config: {}

    # agint-self-model: read-only observer v0.7.1. Capability map
    # (CAN/CANNOT/UNCERTAIN) + reasoning profile + resource baseline + calibration.
    - id: agint-self-model
      name: ./plugins/agint-self-model/lib/index.js
      config: {}

    # agint-evolution-memory: evolution-only memory. Distinct from task memory;
    # D-QAF auto-write landing.
    - id: agint-evolution-memory
      name: ./plugins/agint-evolution-memory/lib/index.js
      config: {}

    # agint-memory-provider: P1-1 可插拔记忆 Provider 架构（Sprint 15 基础抽象层）
    # v0.1.0 — 2026-09-08 挂载. ExternalProvider 抽象基类 + BuiltinProvider（封装
    # agint.memory，行为完全一致，prefetch 默认只读）+ MemoryManager（激活/降级/
    # 琐碎过滤/召回指示器）+ ProviderRegistry。Service：agint.memoryProvider
    # （listProviders/getActiveProvider/activate/deactivate/getConfig/setConfig/
    # getRecallStatus/getFallbackStats/pause/resume/stats/config 等）。
    # testConnection / runPreCompressCheckpoint / registerProviderTools /
    # routeToolCall 显式抛未实现（Sprint 16 接力）。独占 agint_memory_provider
    # 存储域（5 表）。硬注入 agint.memory（builtin provider 封装源）；软依赖
    # event-bus（provider-activated / provider-activation-failed / recall-injected
    # 三事件）。首挂保守：默认 active_provider=builtin，行为与未挂载时完全一致。
    - id: agint-memory-provider
      name: ./plugins/agint-memory-provider/lib/index.js
      config: {}

    # agint-curriculum: P7 自主课程生成器 v0.1.1（Sprint 14 Part B，2026-09-09 挂载）。
    # 消费 self-model 能力画像，在 UNCERTAIN / 久未复验 / 校准失准的域上生成带
    # 可自动判定通过条件的挑战（4 域模板 codegen/reasoning/planning/tool-use ×
    # D1-D5 难度档，40%-70% 完成率护栏 + 连续序列防刷分）。判定外部化 C1/C2/C3：
    # 挑战必带 verifySpec、自评只进 notes、无 evidence 记 fail。出队不自动执行
    # （auto_execute_enabled 恒 false，§4.5）。Service：agint.curriculum
    # （probe/generate/nextChallenge/submit/list/stats/difficulty/pause/resume/
    # config）。独占 agint_curriculum 存储域（4 表：challenges/attempts/
    # difficulty_state/audit_log）。软依赖 event-bus（4 个 curriculum.* 事件）与
    # self-model（snapshot/update，不可用降级 skipped）。硬注入 storageDomain。
    # 首挂保守：无 cron job、无 generate 工具 —— 挂载后不会自动生成任何挑战，
    # 需 host 服务显式调用或后续补 curriculum-weekly job 才出活。
    - id: agint-curriculum
      name: ./plugins/agint-curriculum/lib/index.js
      config: {}

    # agint-skill-graph: P2-2 技能使用统计与学习图谱 v0.1.0（Sprint 19 实施，2026-09-13 挂载）。
    # 从 tool-stats / preset 目录 / curator 状态聚合技能使用画像与技能关系边
    # （co_use / similar / extends / conflicts 四类），成功失败分离。
    # Service：agint.skillGraph（FROZEN 6：updateFull / getStats / neighbors /
    # clusters / recommend / getCoverage；另有 listForPrompt / exportGraph /
    # proposeConsolidate / setLlmAnnotation / setMode / config / stats）。
    # 独占 agint_skill_graph 存储域（3 表：usage_stats / skill_edges / graph_meta）。
    # 软依赖 event-bus / curator / evolve / skill-autocreate（任一缺失均降级不报错）。
    # **只读消费上游**：不调用 curator 任何写方法，不进 policy / HARM / evolution 决策。
    # 每周图谱由 agint-cron 的 skill-graph-weekly job 驱动（周日 07:00）。
    # ⚠️ 默认档 count-only（标定期）：只扫不落正式图，正式表 0 行 → health 恒 EMPTY。
    #    看几周 lastCalibration（「若转 live 会得到多少节点/边」）、promotable=true
    #    后才用 skillGraph_set_mode('live') 切档（未跑过标定期调用会直接抛错）。
    - id: agint-skill-graph
      name: ./plugins/agint-skill-graph/lib/index.js
      config: {}

    # agint-trajectory: P2-1 进化轨迹记录（训练数据层）v0.1.0（Sprint 18 实施，2026-09-13 挂载）。
    # 把 task / dream / eval / evolution / subagent 五类执行记为结构化轨迹，成功失败分离
    # 存储，ShareGPT + JSONL 双格式导出（离线分析与未来微调原料）。
    # Service：agint.trajectory（record / getStats / export / prune / setRecordMode /
    # config 等）。独占 agint_trajectory 存储域（schemaVersion 1）。
    # 硬注入 storageDomain；软依赖 event-bus / metrics / toolStats（缺失均降级不报错）。
    # 订阅 6 类事件：dream.completed / evolution.proposed / evolution.evaluated /
    # diagnosis.completed / evo-orch.task-started / evo-orch.task-completed。
    # 治理六件套：采样 / 脱敏 / 截断 / 预算 / prune / 熔断。
    # **轨迹数据不进任何在线决策**；**不注册 model-visible 工具**（观察层）。
    # ⚠️ 默认档 count-only（标定期）：不落正式轨迹表，只写 meta + 标定报告。
    #    无 ready 标定报告直接 setRecordMode('live') 会被不变量 #5 硬门禁拒绝并抛错。
    - id: agint-trajectory
      name: ./plugins/agint-trajectory/lib/index.js
      config: {}

    # agint-compress-guard: P3-1 记忆压缩检查点机制 v0.1.0（Sprint 20 实施，2026-09-13 挂载）。
    # 立场：压缩可以发生，上下文不许消失（M4 fail-closed）。
    # Service：agint.compressGuard（FROZEN 6：checkpoint / extract / search /
    # recall / stats / setEnabled）。
    # 两段式粒度：raw 检查点写失败 = 硬门 BLOCKED_CHECKPOINT（shadow 档只告警不真中止）；
    # 洞察提取失败 / 3s 软超时 = 软降级 DEGRADED_INSIGHT，300s 冷却 → 探针 → 复位。
    # 硬注入 storageDomain + agint.memory；软依赖 event-bus / agint.memoryProvider。
    # 独占 agint_compress_guard 存储域（4 表 schemaVersion 1）；raw 唯一事实源仍归
    # P1-1（Q3 分层不重建，双 id 空间 pcc_* / compactionId）。
    # 接线：B 档主战场 = ctx.on('session/event') 过滤 compaction/start|summary|end|prune；
    # C 档 = 显式 checkpoint() 委托 P1-1 runPreCompressCheckpoint；A 档已移出设计。
    # 恢复双通道：compress_recall 工具 + 记忆查询 miss 兜底一次（装饰 agint.memory.search，
    # 单次单向不回写，切断「压缩产物→记忆→再压缩」自我污染）。
    # ⚠️ 三处保守：① shadow 档硬门只告警；② provider 注册进 P1-1 registry 但**不自动激活**；
    #    ③ 本机 R10 探针实测 0 次压缩（155 会话 / 140,109 事件）→ 标定期 stats() 恒
    #    NO_SOURCE_REACHED，是如实报警不是故障。转正由老板一周后拍板。
    - id: agint-compress-guard
      name: ./plugins/agint-compress-guard/lib/index.js
      config: {}
