# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# This file mounts the AGINT (智进) host services into the dsh web profile.
# The plugins themselves live at D:\DSH\project\DSH-AGINT\plugins\agint-*
# and are installed via the install script. If the plugin source is not yet
# available, comment out the corresponding rows below.

# ── AGINT 智进 host services ──────────────────────────────────────────────────
#
# Host-plane row that injects a service is the criterion for host-plane
# ownership: injection resolves before any session exists, so there is no
# agent to key by. Every agint-* plugin below is a host service consumer,
# not a per-session capability — they all sit in this patch layer.

- insert:
    # agint-memory: long-term memory (L1-L4 four-tier forgetting). Owns the
    # `agint` storage domain exclusively.
    - id: agint-memory
      name: ./plugins/agint-memory/lib/index.js
      config: {}

    # agint-dream: nightly dream service (light → REM → deep). Reads session
    # logs → heuristics → six-dim score → gate → promote into agint.memory.
    # Diary at <root>/YYYY-MM-DD.md. Triggered by agint-cron's night-dream
    # job (daily 03:00).
    - id: agint-dream
      name: ./plugins/agint-dream/lib/index.js
      config:
        root: !!js (process.env.AGINT_HOME || (process.env.HOME + '/projects/AGINT')) + '/dreams'
        sessionsRoot: !!js (process.env.DSH_HOME || (process.env.HOME + '/.dsh')) + '/sessions'
        lookbackDays: 2

    # agint-wiki: knowledge base (independent of task memory).
    - id: agint-wiki
      name: ./plugins/agint-wiki/lib/index.js
      config:
        root: !!js (process.env.AGINT_HOME || (process.env.HOME + '/projects/AGINT')) + '/wiki'

    # agint-cron: scheduled tasks. 5-segment cron, missed triggers do NOT replay.
    - id: agint-cron
      name: ./plugins/agint-cron/lib/index.js
      config: {}

    # agint-rules: rule gate (advisory + ask + deny). Owns `agint_rules` domain
    # exclusively. Listens on tools/pre-execute + tools/post-execute waterfalls.
    - id: agint-rules
      name: ./plugins/agint-rules/lib/index.js
      config: {}

    # agint-metrics: evolution metrics. Owns `agint_metrics` domain. Reads
    # agint.cron/rules/wiki/memory lazy, writes kv time series. Daily via cron.
    - id: agint-metrics
      name: ./plugins/agint-metrics/lib/index.js
      config: {}

    # agint-evolve: review / self-evolution loop. Reports to <root>/reviews.
    # Sundays via cron's evolve-review job.
    - id: agint-evolve
      name: ./plugins/agint-evolve/lib/index.js
      config:
        root: !!js (process.env.AGINT_HOME || (process.env.HOME + '/projects/AGINT')) + '/reviews'

    # agint-tool-stats: tool usage profile. Listens on tools/result events,
    # appends to ~/.dsh/storages/agint_tool_stats.jsonl.
    - id: agint-tool-stats
      name: ./plugins/agint-tool-stats/lib/index.js
      config: {}

    # agint-quality-contract: D-QAF evaluation framework Seam layer (FROZEN).
    # Defines schemas + interfaces; siblings (eval/sandbox/policy/report) plug
    # in. L0-frozen field guard via validatePatch.
    - id: agint-quality-contract
      name: ./plugins/agint-quality/agint-quality-contract/lib/index.js
      config: {}

    # agint-quality-sandbox: D-QAF sandbox runtime v0.6.3. In-process/隔离双模式
    # 资源矩阵 + runSmoke/runVerify/runExplore；provide agint.qualitySandbox。
    # agint-quality-eval / agint-mount 依赖此服务。
    - id: agint-quality-sandbox
      name: ./plugins/agint-quality-sandbox/lib/index.js
      config: {}

    # agint-quality-eval: D-QAF evaluation engine v0.2. 7-dim scoring; safety
    # gate (×0.30) vetoes below 0.5 → REJECT. Sunday 04:30 weekly evaluation.
    # Reject self-evaluation.
    - id: agint-quality-eval
      name: ./plugins/agint-quality/agint-quality-eval/lib/index.js
      config: {}

    # agint-quality-policy: D-QAF Phase 4 policy engine. 4 decisions
    # (AUTO_DEPLOY / PENDING_REVIEW / REJECT / ABSTAIN); false-harmony
    # detector + meta-evaluation committee.
    - id: agint-quality-policy
      name: ./plugins/agint-quality/agint-quality-policy/lib/index.js
      config: {}

    # agint-quality-report: HARM report generator. QualityReporterIface impl.
    - id: agint-quality-report
      name: ./plugins/agint-quality/agint-quality-report/lib/index.js
      config: {}

    # agint-quality-sdk: Prompt SDK v0.5. PromptManifest FROZEN schema +
    # template engine + static check + CLI.
    - id: agint-quality-sdk
      name: ./plugins/agint-quality-sdk/lib/index.js
      config: {}

    # agint-quality-static: static-analysis rule check (l0-isolation +
    # safety-boundary + prompt-injection).
    - id: agint-quality-static
      name: ./plugins/agint-quality-static/lib/index.js
      config: {}

    # agint-diagnosis: attribution engine v0.6.0. 6-class root-cause tagging
    # + counterfactual simulation + pattern clustering + time-window reports.
    - id: agint-diagnosis
      name: ./plugins/agint-diagnosis/lib/index.js
      config: {}

    # agint-mutator: mutation constructor v0.6.1. 3 modification schemes
    # (PROMPT_MUTATION / TOOL_SYNTHESIS / STRATEGY_REWRITE) +
    # propose/validate/commit/rollback three-segment transaction.
    - id: agint-mutator
      name: ./plugins/agint-mutator/lib/index.js
      config: {}

    # agint-population: population manager v0.6.2. Three-variant tournament.
    - id: agint-population
      name: ./plugins/agint-population/lib/index.js
      config: {}

    # agint-mount: dynamic mount orchestrator v0.6.5. 4-state state machine +
    # three-segment transaction + health probe + L0 isolation.
    - id: agint-mount
      name: ./plugins/agint-mount/lib/index.js
      config: {}

    # agint-abtest: A/B test framework v0.6.4.
    - id: agint-abtest
      name: ./plugins/agint-abtest/lib/index.js
      config: {}

    # agint-event-bus: event bus v0.7.0. FROZEN event-bus schema + 3 services +
    # deadletter / isolation / backoff / traceId + sync quota.
    - id: agint-event-bus
      name: ./plugins/agint-event-bus/lib/index.js
      config: {}

    # agint-self-model: read-only observer v0.7.1. Capability map
    # (CAN/CANNOT/UNCERTAIN) + reasoning profile + resource baseline + calibration.
    - id: agint-self-model
      name: ./plugins/agint-self-model/lib/index.js
      config: {}

    # agint-evolution-memory: evolution-only memory. Distinct from task memory;
    # D-QAF auto-write landing.
    - id: agint-evolution-memory
      name: ./plugins/agint-evolution-memory/lib/index.js
      config: {}
