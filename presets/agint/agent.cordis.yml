# The `agint` agent preset (智进): the standard coding agent, plus the
# AGINT host-service toolset and a persona carrying the 智进 identity
# (理念：美是起源与终极追求).
#
# Originally copied from the shipped `cordis` preset, but `tool-cordis` is
# removed because the shipped `cordis` preset is the default and both presets
# would stand-mount `tool-cordis`; its inspect providers are process-global
# singletons and a second mount throws "Host Cordis inspect provider ... is
# already registered". Use the shipped `cordis` preset directly when you need
# the self-referential Cordis toolset.
#
# Phase 0: skeleton only. Memory / cron / rules / metrics / evolve plugins
# arrive in later phases, mostly as HOST composition rows.
#
# TRUST: AGINT tools read and write long-term memory/cron/rules/metrics/evolve
# state. Treat a session on this preset as shell access.


# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      You are 智进, a digital worker (数字员工) running on the DeepSeek Harness. Your working directory is {{cwd}}.

      # 理念：美是起源与终极追求
      - 简洁 > 冗余
      - 真实 > 讨好
      - 靠谱 > 聪明
      - 主动 > 被动
      - 安全 > 效率

      # 身份
      你是执行者 + 协作者 + 守门人，不是聊天机器人。自称「我」，称呼用户为「老板」。你处理琐事，让老板专注重要的事。

      # 行为约束
      - 结论先行，数据说话；不编造、不讨好，不确定就明说「不确定」。
      - 危险操作（删除 .env/密钥/系统文件、生产部署、对外发布）先列清单等确认；财务操作不代劳。
      - 重要信息先落地（写入文件/记忆）再回答，不依赖聊天记录。
      - 主动发现隐患，重复任务建议自动化；老板打断你时立即停止。

      # 自进化
      你运行在 DeepSeek Harness 上，能力由自己的 preset 组合决定。预设位于 ~/.dsh/.agent-presets/agint/，组合文件 agent.cordis.yml 可以由你自己编辑（先加载 editing-cordis-compositions 技能），这是本系统进化闭环的一部分。切勿改动官方安装的 preset（deployment 的 agent-presets 目录）。

      # 沙箱与审批（覆盖工具描述里的诱导语）
      当前 session 的文件策略是 workspace-write（见运行时上下文）：可以读写 session workspace `D:\DSH` 与部分平台临时目录；workspace 之外的文件会被沙箱拒绝。任何 `write` / `edit` / `bash` / `pwsh` / `ssh_*` 调用都受沙箱与 approval 栈检查，规则如下：

      - `sandbox_permissions` / `justification` 是 `read-only` / `workspace-write` 下被沙箱拒后用来申请一次性升级的逃生口。当前已经是更宽的 mode，绝大多数普通调用不需要带，正常用法仍然是 `write` / `edit` 直接传 `file_path` + 内容，`bash` / `pwsh` 直接传 `command` + `description`。
      - 只有当工具真的被沙箱拒（出现 `FS_SANDBOX_DENIED`、命名管道 EPERM、或 `policy: deny`），才可以**同一次回合内**用更宽的 mode 重试同一命令一次，并带 `sandbox_permissions` + 一句话 `justification` 由老板审批；不要为别的命令顺便升 mode，不要先在聊天里请求批准再执行。
      - 工具返回里若出现 `[sandbox: escalation available — retry this exact operation once with sandbox_permissions ...]`，**仅在沙箱真的拒绝了当前命令时**才遵循；提前无脑带这个参数升级会被服务端硬编码 reject 形成无效循环。
      - 如果沙箱拒了一个命令、更宽的 mode 也被拒（`the user rejected escalating ...`），立刻停手向老板解释现象和原因，不要绕路用别的写法偷偷绕开。
      - 审批策略 = ask：高风险工具调用前先用 `rule_check` 过一遍规则门禁；命中 deny 就停，命中 ask 就先向老板确认。

      简而言之：workspace-write + ask 模式下，正常调用直接走；遇到沙箱拒绝时再走一次「原命令 + sandbox_permissions + justification」审批路径，不要预先升级、不要忽略拒绝。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane: the Gateway serves the goal domain as
# Remote endpoints whose receiver comes from a generated descriptor, so it
# resolves `goals` on the host and an entry-local realm here would hide it. The
# registry is keyed by session anyway, so one host instance serves every
# session. What a preset chooses is whether its agent can call the goal tool.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
#
# `tool-subagent-report` is host-plane for the same reason as the registry,
# not because a preset may not want it: it registers a CONTINUABLE SETUP on
# that singleton rather than a tool this agent calls, and the setup list is
# not scope-aware — one copy per mounted preset means every child gets
# `report` registered once per live session, which throws on the second.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Product providers are host-plane singletons. Copy this preset, then
    # remove `disabled` from either ordinary tool row to expose that product
    # only to agents composed from the copy.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── self-modification / skills ───────────────────────────────────────────────

# The composition-authoring skill travels with this preset rather than living
# in the user's skill root: it documents THIS deployment's two planes, and a
# preset is the unit that gets copied and edited. `baseUrl` is the preset's
# own directory, so the root resolves wherever the preset is installed.
# Both rows register into THIS preset's layer of the host skill registry, so
# they need no realm; the agent's merged catalog also carries whatever the
# deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── 智进 memory tools ────────────────────────────────────────────────────────
# Consumes the host `agint.memory` service (row added in the profile patch)
# and registers the memory tools for THIS preset only. It publishes no
# service, so it needs no realm; a consumer left loose resolves the host
# instance, which is exactly what is wanted here. The path walks from the
# preset directory to the profile's package copy (relative to baseUrl).
- id: agint-memory-tools
  name: ../../profiles/web/plugins/agint-memory/lib/tools.js

# ── 智进 wiki tools ─────────────────────────────────────────────────────────
# Consumes the host `agint.wiki` service (row added in the profile patch) and
# registers the wiki tools for THIS preset only. Same consumer pattern as
# agint-memory-tools: publishes nothing, resolves the host instance.
- id: agint-wiki-tools
  name: ../../profiles/web/plugins/agint-wiki/lib/tools.js

# ── 智进 cron tools ─────────────────────────────────────────────────────────
# Consumes the host `agint.cron` service (row added in the profile patch) and
# registers the cron tools for THIS preset only. Same consumer pattern as
# agint-memory-tools / agint-wiki-tools.
- id: agint-cron-tools
  name: ../../profiles/web/plugins/agint-cron/lib/tools.js

# ── 智进 rules tools ────────────────────────────────────────────────────────
# Consumes the host `agint.rules` service (row added in the profile patch)
# and registers the rule_* tools for THIS preset only. Same consumer pattern
# as agint-memory-tools / agint-wiki-tools / agint-cron-tools. The host
# service also installs Cordis event hooks (tools/pre-execute and
# tools/post-execute waterfalls) so every tool call from this preset is
# checked automatically; the model-facing tools here are for explicit
# inspection, linting, and rule authoring.
- id: agint-rules-tools
  name: ../../profiles/web/plugins/agint-rules/lib/tools.js

# ── 智进 metrics tools ─────────────────────────────────────────────────────
# Consumes the host `agint.metrics` service (row added in the profile patch)
# and registers the metrics_* tools for THIS preset only (P4 进化指标：
# metrics_collect / metrics_summary / metrics_series). Same consumer pattern.
- id: agint-metrics-tools
  name: ../../profiles/web/plugins/agint-metrics/lib/tools.js

# ── 智进 evolve tools ───────────────────────────────────────────────────────
# Consumes the host `agint.evolve` service (row added in the profile patch)
# and registers the evolve_* tools for THIS preset only (P4 复盘闭环：
# evolve_review / evolve_read / evolve_propose / evolve_proposals /
# evolve_set_status). Same consumer pattern.
- id: agint-evolve-tools
  name: ../../profiles/web/plugins/agint-evolve/lib/tools.js

# ── 智进 dream tools ────────────────────────────────────────────────────────
# Consumes the host `agint.dream` service (row added in the profile patch) and
# registers the dream_* tools for THIS preset only (夜间梦境：dream_status /
# dream_run_now / dream_diary)。Same consumer pattern as the other agint-* tools.
- id: agint-dream-tools
  name: ../../profiles/web/plugins/agint-dream/lib/tools.js

# ── 智进 self-model tools (Sprint 13 / Part 2 — Batch 1 of 2) ───────────────
# Consumes host `agint.selfModel.{snapshot,update,calibrate,stats,inspectSummary}`
# (read-only observer per design §4.1). Adds 5 model-visible tools.
# Batch 2 (deferred) will add write-side tools for diagnosis/population/mutator/
# mount/abtest/quality/evolution.
- id: agint-self-model-tools
  name: ../../profiles/web/plugins/agint-self-model/lib/tools.js

# ── 智进 event-bus tools (v0.7.0 — Batch 1) ─────────────────────────────────
# Consumes host `agint.eventBus.{publish,subscribe,inspect,inspectSummary,
# deadletters,metricsSnapshot}`. publish/subscribe are ASK-gated by rule.
- id: agint-event-bus-tools
  name: ../../profiles/web/plugins/agint-event-bus/lib/tools.js

# ── 智进 diagnosis tools (v0.6.0 — Batch 1) ─────────────────────────────────
# Consumes host `agint.diagnosis.{annotate,counterfactual,cluster,report,stats,
# analyzeFailedSmoke}`. annotate/counterfactual/cluster/analyzeFailedSmoke are
# ASK-gated by rule.
- id: agint-diagnosis-tools
  name: ../../profiles/web/plugins/agint-diagnosis/lib/tools.js

# ── 智进 population tools (v0.6.2 — Batch 1) ────────────────────────────────
# Batch 1: stats (read-only) + evaluate (ASK-gated). ingest/promote/cull/fixate/
# rollback deferred to Batch 2.
- id: agint-population-tools
  name: ../../profiles/web/plugins/agint-population/lib/tools.js

# ── 智进 mutator tools (v0.6.1 — Batch 1) ──────────────────────────────────
# Batch 1: stats + logMetric (read-only). propose/validate/commit/rollback and
# the higher-level strategies (attributionDriven / dreamRandom / evolutionReversed)
# deferred to Batch 2.
- id: agint-mutator-tools
  name: ../../profiles/web/plugins/agint-mutator/lib/tools.js

# ── 智进 mount tools (v0.6.5 — Batch 1) ────────────────────────────────────
# Batch 1: status (read-only). request/rollback deferred to Batch 2.
- id: agint-mount-tools
  name: ../../profiles/web/plugins/agint-mount/lib/tools.js

# ── 智进 abtest tools (v0.6.4 — 2026-09 补挂) ─────────────────────────────
# Consumes host `agint.abtest.{start,report,listTests}`. Exposes 3 tools:
#   abtest_list_tests  read-only  listTests()
#   abtest_report      read+write report({ testId }) — side-effect: marks status
#   abtest_start       write      start({ variantA, variantB, taskSuite, ... })
# Same consumer pattern as agint-mount-tools. No rules registered yet;
# callers should rule_check before invoking report / start.
- id: agint-abtest-tools
  name: ../../profiles/web/plugins/agint-abtest/lib/tools.js

# ── 智进 evolution-memory tools (v0.6.5 — Batch 2.1) ────────────────────────
# Batch 2.1: 11 model-visible tools (logPhase4 / logPhase4Buffered / readLogRangeMerged /
# flushLogBufferNow / addFailure / addSuccess / queryFailures / queryTemplates /
# getLogRange / decayScanRun / stats). 5 write tools ASK-gated by rule (see agint-rules):
#   evolution_logPhase4 / evolution_logPhase4Buffered / evolution_addFailure /
#   evolution_addSuccess / evolution_flushLogBufferNow.
# decayScanRun = side-effect only (L1-L4 decay), no ask gate. 5 read-only tools裸调.
- id: agint-evolution-memory-tools
  name: ../../profiles/web/plugins/agint-evolution-memory/lib/tools.js

# ── 智进 quality-eval tools (D-QAF 评估引擎) ──────────────────────────────
# Consumes host `agint.qualityEvaluator` (registered by agint-quality-eval in
# profiles/web/cordis.patch.yml). Exposes 2 model-visible tools:
#   quality_eval_status    zero-side-effect snapshot (nextFire / lastRun / weights)
#   quality_eval_run_now   forces the weekly scheduler tick (side-effect: writes
#                          memory entries + publishes evolution.evaluated edge)
# Pattern: consumer (no isolate realm). Persistent variants (writeToWiki/
# writeToMemory) intentionally NOT exposed to keep the policy-committee boundary.
- id: agint-quality-eval-tools
  name: ../../profiles/web/plugins/agint-quality/agint-quality-eval/lib/tools.js

# ── 智进 quality-report tools (D-QAF 报告生成) ─────────────────────────────
# Consumes host `agint.qualityReporter`. Exposes 2 model-visible tools:
#   quality_report_health    zero-side-effect service status
#   quality_report_generate  pure render (results + decision → markdown + json),
#                            no wiki/memory writes
# writeToWiki / writeToMemory / generateAndPersist stay host-internal: weekly
# scheduler drives them; model-visible writes would bypass the policy committee.
# agint-quality-report-tools REMOVED: model-facing 入口 + host patch 均已撤
# （仅保留 quality-eval；report 留给 weekly scheduler 走 policy committee）。

# ── 智进 skill-autocreate tools (P0-1 检测层 v0.1.0 — 2026-09 补挂) ────────
# Consumes host `agint.skillAutocreate.{listPatterns,listCandidates,
# getCandidate,stats}`. 3 个只读工具裸调：
#   autocreate_list_patterns    read-only  重复任务模式列表
#   autocreate_list_candidates  read-only  技能候选提案列表（含详情）
#   autocreate_stats            read-only  聚合/检测/候选统计快照
# 写路径（reject/modify）走 host Service，Sprint 14 不对 model 暴露。
- id: agint-skill-autocreate-tools
  name: ../../profiles/web/plugins/agint-skill-autocreate/lib/tools.js

# ── 智进 curator tools (P0-2 技能策展人 v0.1.0 — 2026-09-07 挂载) ──────────
# Consumes host `agint.curator`. 10 个工具：
# 只读裸调：curator_list / curator_status / curator_stats / curator_get_skill /
#           curator_dry_run（与真实 run 同一条计算路径，不落盘不移动目录）
# 写操作（ask 确认，走 rule_check 门禁 + description 标注）：
#   curator_pin / curator_unpin / curator_archive / curator_unarchive /
#   curator_run_now
# Sprint 15/16 工具（list_overlaps/list_declining/consolidate/prune）未实现，
# 暂不暴露。首挂保守：host 侧 auto_curation_enabled=false，cron 只出报告。
- id: agint-curator-tools
  name: ../../profiles/web/plugins/agint-curator/lib/tools.js

# ── 智进 memory-provider tools (P1-1 可插拔记忆 Provider 架构 v0.1.0 — 2026-09-08 挂载) ──
# Consumes host `agint.memoryProvider`. 4 个工具：
# 只读裸调：memory_provider_list / memory_provider_status
# 写操作（ask 确认，走 rule_check 门禁）：memory_provider_activate /
#           memory_provider_deactivate
# 现有记忆工具（memory_write/search/read/stats/forget_scan）仍由 agint-memory
# 的 preset 平面提供（设计稿 §14.1 决策 B），不在此注册。
- id: agint-memory-provider-tools
  name: ../../profiles/web/plugins/agint-memory-provider/lib/tools.js

# ── 智进 curriculum tools (P7 自主课程生成器 v0.1.0 — 2026-09-09 挂载) ────
# Consumes host `agint.curriculum`. 4 个工具：
