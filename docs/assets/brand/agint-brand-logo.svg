<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 363" role="img" aria-label="AGINT">
  <title>AGINT — self-evolving intelligence framework</title>
  <desc>字母 A 与自进化回环交织：回环上端收进 A 顶点之后，下端从右笔画上方穿出。深空蓝 #0A1B34，信号青 #24D3E5。</desc>
  <!-- 图标层 1：回环整弧（308°，上端将被 A 顶点遮住） -->
  <path fill="#24D3E5" d="M169.1,82.5 A106.5,106.5 0 1 1 135.6,169.6 L163.5,167.2 A78.5,78.5 0 1 0 188.2,103 Z"/>
  <!-- 图标层 2：字母 A（无横梁，锐顶点） -->
  <path fill="#0A1B34" d="M173,20 L19.9,343 L58.4,343 L173,101.3 L287.6,343 L326.1,343 Z"/>
  <!-- 标准字 GINT -->
  <g fill="#0A1B34">
    <!-- G：环形 + 右上开口 + 中杠 -->
    <path d="M469.1,270.1 A55.5,55.5 0 1 1 447.3,239 L434.1,257.9 A32.5,32.5 0 1 0 446.9,276.1 Z"/>
    <rect x="415.5" y="269" width="55.5" height="22"/>
    <!-- I -->
    <rect x="492" y="229" width="24" height="112"/>
    <!-- N：双竖 + 对角 -->
    <rect x="541" y="229" width="23" height="112"/>
    <rect x="617" y="229" width="23" height="112"/>
    <path d="M541,229 L563,229 L640,341 L618,341 Z"/>
    <!-- T -->
    <rect x="657" y="229" width="95" height="23"/>
    <rect x="683.5" y="229" width="23" height="112"/>
  </g>
  <!-- 图标层 3：回环下段（从右笔画上方穿出，压在 A 之上） -->
  <path fill="#24D3E5" d="M135.6,169.6 A106.5,106.5 0 0 0 302.8,247.6 L286.7,224.7 A78.5,78.5 0 0 1 163.5,167.2 Z"/>
</svg>
