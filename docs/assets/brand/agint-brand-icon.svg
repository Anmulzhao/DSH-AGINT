<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="AGINT">
  <title>AGINT 图标</title>
  <desc>字母 A 与自进化回环交织：回环上端收进 A 顶点之后，下端从右笔画上方穿出。深空蓝 #0A1B34，信号青 #24D3E5。</desc>
  <g transform="translate(-4.05,-1.5)">
    <!-- 层 1：回环整弧（308°，上端将被 A 顶点遮住） -->
    <path fill="#24D3E5" d="M169.1,82.5 A106.5,106.5 0 1 1 135.6,169.6 L163.5,167.2 A78.5,78.5 0 1 0 188.2,103 Z"/>
    <!-- 层 2：字母 A（无横梁，锐顶点） -->
    <path fill="#0A1B34" d="M173,20 L19.9,343 L58.4,343 L173,101.3 L287.6,343 L326.1,343 Z"/>
    <!-- 层 3：回环下段（从右笔画上方穿出，压在 A 之上）——实现编织关系 -->
    <path fill="#24D3E5" d="M135.6,169.6 A106.5,106.5 0 0 0 302.8,247.6 L286.7,224.7 A78.5,78.5 0 0 1 163.5,167.2 Z"/>
  </g>
</svg>
